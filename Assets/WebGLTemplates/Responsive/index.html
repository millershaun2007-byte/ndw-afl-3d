<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Real, dedicated control bar below the game view — matches the
         rest of the app's convention (e.g. Creature Chaos's DPad): touch
         controls live in their own always-visible space, never floating
         translucently on top of the game itself. */
      #app { display: flex; flex-direction: column; width: 100%; height: 100%; background: #1a2f1a; }
      #canvas-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}; }
      #control-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
        padding: 10px clamp(8px, 3vw, 18px); gap: clamp(14px, 4vw, 26px); background: #16241a;
        border-top: 2px solid rgba(255,255,255,0.08); }
      /* Two buttons only (2026-08-11 beat rewrite, issue #1): MOVE is
         hold-to-advance in a fixed direction, nothing else — no steering.
         MARK is the single tap every beat uses (ruck tap, clearance kick,
         mark contest, set shot all read the same button, graded against
         whatever AFLBeatPrompt is currently drawing on screen). KICK is
         gone — there is no more charge-and-release, since aim/power now
         always come from the same tap-against-the-arrow mechanic. */
      .action-btn { width: clamp(64px, 20vw, 100px); height: clamp(64px, 20vw, 100px); border-radius: 20px;
        border: 2px solid rgba(255,255,255,0.35); color: #fff; font-size: clamp(0.65rem, 2.2vw, 1.05rem);
        font-weight: 800; display: flex; align-items: center; justify-content: center; touch-action: none;
        user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0; text-align: center; }
      #move-btn { background: #1f8f3d; }
      #mark-btn { background: #2fae4d; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      </div>
      <div id="control-bar">
        <div id="move-btn" class="action-btn">MOVE</div>
        <div id="mark-btn" class="action-btn">MARK</div>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Real fix (2026-08-11, issue #1): this used to multiply by
      // window.devicePixelRatio on top of Unity's own canvas sizing,
      // fighting it — result was a wrong-scale HUD and up to 4-9x the
      // pixels actually needed to render, which costs real FPS/latency on
      // exactly the low-end devices this game needs to run well on.
      // Setting the backing buffer straight to the CSS size and letting
      // Unity manage its own resolution is the fix, not a smaller
      // multiplier.
      function resizeCanvasToContainer() {
        var w = Math.max(1, Math.round(canvas.clientWidth));
        var h = Math.max(1, Math.round(canvas.clientHeight));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
      }
      window.addEventListener('resize', resizeCanvasToContainer);
      resizeCanvasToContainer();

      var unityInstanceRef = null;

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
#if DECOMPRESSION_FALLBACK
        decompressionFallback: true,
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        resizeCanvasToContainer();
      }).catch(function (message) {
        alert(message);
      });

      // ---- Real HTML control bar, talking to Unity via SendMessage ----
      // (AFLTouchBridge.cs, GameObject name "TouchBridge" — must match)
      function sendToUnity(method, value) {
        if (unityInstanceRef) unityInstanceRef.SendMessage('TouchBridge', method, value);
      }

      // Held (not tapped): while pressed, advance forward — a fixed
      // direction set once per beat by AFLGameManager, never steered by
      // this button. Released, stop.
      var moveBtn = document.getElementById('move-btn');
      moveBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('SetMoveHeld', '1'); });
      moveBtn.addEventListener('pointerup', function () { sendToUnity('SetMoveHeld', '0'); });
      moveBtn.addEventListener('pointercancel', function () { sendToUnity('SetMoveHeld', '0'); });
      moveBtn.addEventListener('pointerleave', function () { sendToUnity('SetMoveHeld', '0'); });

      // The one verb every beat uses — see AFLBeatPrompt.
      var markBtn = document.getElementById('mark-btn');
      markBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('MarkPressed', ''); });
    </script>
  </body>
</html>
