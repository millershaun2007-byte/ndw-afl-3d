<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Real, dedicated control bar below the game view — matches the
         rest of the app's convention (e.g. Creature Chaos's DPad): touch
         controls live in their own always-visible space, never floating
         translucently on top of the game itself. */
      #app { display: flex; flex-direction: column; width: 100%; height: 100%; background: #1a2f1a; }
      #canvas-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}; }
      #control-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
        padding: 10px clamp(8px, 3vw, 18px); gap: clamp(8px, 3vw, 14px); background: #16241a;
        border-top: 2px solid rgba(255,255,255,0.08); }
      /* Real design change 2026-08-10 — the analog joystick was removed
         entirely (Shaun's explicit call: it stayed the single clearest
         unfixable problem across many real attempts — direction bugs,
         "stumbling around," genuinely too hard for a kid to aim
         precisely). Movement is now a single hold-to-run MOVE button —
         each side only ever advances straight down its own fixed lane
         toward its own goal. No steering exists anywhere in this game
         anymore. TO BALL (steer-to-ball assist) is gone too, since
         there's no more steering left to assist. */
      .action-btn { width: clamp(44px, 12vw, 88px); height: clamp(44px, 12vw, 88px); border-radius: 16px;
        border: 2px solid rgba(255,255,255,0.35); color: #fff; font-size: clamp(0.58rem, 1.9vw, 1.05rem);
        font-weight: 800; display: flex; align-items: center; justify-content: center; touch-action: none;
        user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
      #move-btn { background: #1f8f3d; }
      #jump-btn { background: #2fae4d; }
      #kick-btn { background: #e8720f; }
      #ground-btn { background: #8a5a2b; font-size: clamp(0.55rem, 1.7vw, 0.9rem); }
      #handball-btn { background: #3a7fd6; font-size: clamp(0.5rem, 1.6vw, 0.85rem); }
      #action-row { display: flex; gap: clamp(5px, 2vw, 14px); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      </div>
      <div id="control-bar">
        <div id="action-row">
          <div id="move-btn" class="action-btn">MOVE</div>
          <div id="jump-btn" class="action-btn">JUMP</div>
          <div id="ground-btn" class="action-btn">GROUND</div>
          <div id="handball-btn" class="action-btn">HANDBALL</div>
          <div id="kick-btn" class="action-btn">KICK</div>
        </div>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToContainer() {
        var dpr = window.devicePixelRatio || 1;
        var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
        var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
      }
      window.addEventListener('resize', resizeCanvasToContainer);
      resizeCanvasToContainer();

      var unityInstanceRef = null;

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
#if DECOMPRESSION_FALLBACK
        decompressionFallback: true,
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        resizeCanvasToContainer();
      }).catch(function (message) {
        alert(message);
      });

      // ---- Real HTML control bar, talking to Unity via SendMessage ----
      // (TouchBridge.cs, GameObject name "TouchBridge" — must match)
      function sendToUnity(method, value) {
        if (unityInstanceRef) unityInstanceRef.SendMessage('TouchBridge', method, value);
      }

      // Real design change 2026-08-10 — held (not tapped), same pattern as
      // KICK: while pressed, the player advances straight down their own
      // fixed lane toward their own goal. Released, they stop. No
      // steering/direction to send at all anymore — the joystick this
      // replaced was the single clearest unfixable control problem across
      // many real attempts.
      var moveBtn = document.getElementById('move-btn');
      moveBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('SetMoveForwardHeld', '1'); });
      moveBtn.addEventListener('pointerup', function () { sendToUnity('SetMoveForwardHeld', '0'); });
      moveBtn.addEventListener('pointercancel', function () { sendToUnity('SetMoveForwardHeld', '0'); });
      moveBtn.addEventListener('pointerleave', function () { sendToUnity('SetMoveForwardHeld', '0'); });

      var jumpBtn = document.getElementById('jump-btn');
      jumpBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('QueueJump', '1'); });

      var kickBtn = document.getElementById('kick-btn');
      kickBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('SetKickHeld', '1'); });
      kickBtn.addEventListener('pointerup', function () { sendToUnity('SetKickHeld', '0'); sendToUnity('QueueKickReleased', '1'); });
      kickBtn.addEventListener('pointercancel', function () { sendToUnity('SetKickHeld', '0'); });
      kickBtn.addEventListener('pointerleave', function () { sendToUnity('SetKickHeld', '0'); });

      var handballBtn = document.getElementById('handball-btn');
      handballBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('QueueHandball', '1'); });

      var groundBtn = document.getElementById('ground-btn');
      groundBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('QueueGroundPickup', '1'); });
    </script>
  </body>
</html>
