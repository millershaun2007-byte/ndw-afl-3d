<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Real, dedicated control bar below the game view — matches the
         rest of the app's convention (e.g. Creature Chaos's DPad): touch
         controls live in their own always-visible space, never floating
         translucently on top of the game itself. */
      #app { display: flex; flex-direction: column; width: 100%; height: 100%; background: #1a2f1a; }
      #canvas-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}; }
      #control-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
        padding: 10px clamp(8px, 3vw, 18px); gap: clamp(8px, 2vw, 14px); background: #16241a;
        border-top: 2px solid rgba(255,255,255,0.08); }
      /* Real design change 2026-08-10 — this game's earlier version tried a
         freeform drag joystick and it was the single clearest unfixable
         control problem across many real attempts (direction bugs,
         "stumbling around," genuinely too hard for a kid to aim
         precisely). This rewrite needs real 2D movement (no more fixed
         lane), so instead of bringing the joystick back, movement is a
         D-pad — four discrete, combinable directions, no angle-aiming
         required. Matches the app's own existing convention (Creature
         Chaos's DPad, see CLAUDE.md) rather than inventing a new pattern. */
      #dpad { position: relative; width: clamp(120px, 34vw, 168px); height: clamp(120px, 34vw, 168px); flex-shrink: 0; }
      .dpad-btn { position: absolute; width: clamp(40px, 11vw, 56px); height: clamp(40px, 11vw, 56px);
        background: #1f8f3d; border: 2px solid rgba(255,255,255,0.35); border-radius: 12px; color: #fff;
        font-size: clamp(1rem, 3vw, 1.4rem); display: flex; align-items: center; justify-content: center;
        touch-action: none; user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .dpad-btn.active { background: #3fc463; }
      .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
      .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
      .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); }
      .dpad-right { right: 0; top: 50%; transform: translateY(-50%); }
      .action-btn { width: clamp(48px, 13vw, 76px); height: clamp(48px, 13vw, 76px); border-radius: 16px;
        border: 2px solid rgba(255,255,255,0.35); color: #fff; font-size: clamp(0.5rem, 1.7vw, 0.85rem);
        font-weight: 800; display: flex; align-items: center; justify-content: center; touch-action: none;
        user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0; text-align: center; }
      #jump-btn { background: #2fae4d; }
      #kick-btn { background: #e8720f; }
      #handball-btn { background: #3a7fd6; }
      #tackle-btn { background: #b23a5a; }
      #action-row { display: flex; gap: clamp(5px, 1.6vw, 10px); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      </div>
      <div id="control-bar">
        <div id="dpad">
          <div id="dpad-up" class="dpad-btn dpad-up">▲</div>
          <div id="dpad-left" class="dpad-btn dpad-left">◀</div>
          <div id="dpad-right" class="dpad-btn dpad-right">▶</div>
          <div id="dpad-down" class="dpad-btn dpad-down">▼</div>
        </div>
        <div id="action-row">
          <div id="jump-btn" class="action-btn">MARK</div>
          <div id="kick-btn" class="action-btn">KICK</div>
          <div id="handball-btn" class="action-btn">H-BALL</div>
          <div id="tackle-btn" class="action-btn">TACKLE</div>
        </div>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToContainer() {
        var dpr = window.devicePixelRatio || 1;
        var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
        var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
      }
      window.addEventListener('resize', resizeCanvasToContainer);
      resizeCanvasToContainer();

      var unityInstanceRef = null;

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
#if DECOMPRESSION_FALLBACK
        decompressionFallback: true,
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).then(function (unityInstance) {
        unityInstanceRef = unityInstance;
        resizeCanvasToContainer();
      }).catch(function (message) {
        alert(message);
      });

      // ---- Real HTML control bar, talking to Unity via SendMessage ----
      // (AFLTouchBridge.cs, GameObject name "TouchBridge" — must match)
      function sendToUnity(method, value) {
        if (unityInstanceRef) unityInstanceRef.SendMessage('TouchBridge', method, value);
      }

      // D-pad: each direction is a discrete held button (not a drag), so
      // there's no angle to aim — up to 2 opposite-adjacent directions can
      // be held together for a diagonal, same as a real game-pad D-pad.
      // Sends the combined (x,y) vector to AFLInput on every change, which
      // AFLPlayer converts into camera-relative 3D movement exactly like
      // WASD already does — this is an input scheme change, not a change
      // to the game itself (still fully 3D).
      var dpadState = { up: false, down: false, left: false, right: false };
      function updateDpadVector() {
        var x = (dpadState.right ? 1 : 0) - (dpadState.left ? 1 : 0);
        var y = (dpadState.up ? 1 : 0) - (dpadState.down ? 1 : 0);
        sendToUnity('SetMoveVector', x + ',' + y);
      }
      function bindDpad(id, key) {
        var el = document.getElementById(id);
        el.addEventListener('pointerdown', function (e) { e.preventDefault(); dpadState[key] = true; el.classList.add('active'); updateDpadVector(); });
        function release() { dpadState[key] = false; el.classList.remove('active'); updateDpadVector(); }
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('pointerleave', release);
      }
      bindDpad('dpad-up', 'up');
      bindDpad('dpad-down', 'down');
      bindDpad('dpad-left', 'left');
      bindDpad('dpad-right', 'right');

      var jumpBtn = document.getElementById('jump-btn');
      jumpBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('MarkPressed', ''); });

      var kickBtn = document.getElementById('kick-btn');
      kickBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('SetKickHeld', '1'); });
      kickBtn.addEventListener('pointerup', function () { sendToUnity('KickReleased', ''); });
      kickBtn.addEventListener('pointercancel', function () { sendToUnity('KickReleased', ''); });
      kickBtn.addEventListener('pointerleave', function () { sendToUnity('KickReleased', ''); });

      var handballBtn = document.getElementById('handball-btn');
      handballBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('HandballPressed', ''); });

      var tackleBtn = document.getElementById('tackle-btn');
      tackleBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); sendToUnity('TacklePressed', ''); });
    </script>
  </body>
</html>
