name: Build and deploy AFL 3D

# Real CI/deploy pipeline (2026-08-17) — replaces the manual local
# `Unity -batchmode ... && gcloud storage cp` workflow that led to the
# wrong build silently staying live for weeks (see the main app's
# ndw_footy_game_still_broken memory). Every push to main now produces a
# build traceable to a specific commit and deploys it automatically —
# "what's live" is never ambiguous again.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless GCP auth (Workload Identity Federation)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First real run (2026-08-17) failed pulling Unity's WebGL Docker
      # image: "no space left on device" — a known, common issue on
      # GitHub's standard ubuntu-latest runners, which ship ~14GB free but
      # pre-install several multi-GB toolchains (Android SDK, .NET, GHC)
      # this job never uses. Removing them first is the standard fix.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 2026-08-19 — the missing piece this pipeline was blocked on.
      # Unity killed manual .alf/.ulf portal activation for Personal
      # tier (confirmed directly against Unity's own discussion forum
      # and this machine's real license file — no classic serial at
      # all anymore). This is a dedicated third-party action built
      # specifically to activate Personal via direct credential auth
      # against Unity's licensing API (not browser automation) — the
      # sturdier of the two community workarounds found.
      #
      # First real run failed before ever testing the credentials:
      # "Unity Hub is not installed or not accessible" — this action
      # drives licensing through Hub's own CLI, which the runner never
      # had installed. unity-setup (same author) installs Hub only
      # (unity-version: None skips downloading a full Editor, since
      # game-ci/unity-builder below handles the actual build via its
      # own Docker image separately).
      # 2026-08-21 — the binary-only symlink attempted here previously
      # (/opt/unityhub/unityhub -> /usr/bin/unityhub) didn't actually fix
      # anything: it ran before unity-setup@v2 even adds Unity's own apt
      # repo, so it started as a dangling symlink, AND even once real,
      # getInstalledHubVersion() needs a sibling resources/app.asar next
      # to whatever executable resolves — a lone binary symlink doesn't
      # carry that along. Removed; real fix pending the diagnostic below.
      - name: Install Unity Hub
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: None

      # TEMPORARY — this step above is expected to still fail right now.
      # Need the REAL post-install file layout (after unity-setup@v2's
      # own apt-get install actually runs) to know where the real
      # resources/app.asar lives, so the eventual fix targets the right
      # path instead of guessing again. Remove once the real fix lands.
      - name: DEBUG - locate real unityhub install layout
        if: always()
        run: |
          echo "--- dpkg -L unityhub ---"
          dpkg -L unityhub || true
          echo "--- readlink /usr/bin/unityhub ---"
          readlink -f /usr/bin/unityhub || true
          echo "--- find for app.asar ---"
          sudo find / -xdev -iname 'app.asar' 2>/dev/null || true
          echo "--- find for unityhub-related dirs/files ---"
          sudo find /usr /opt -iname '*unityhub*' 2>/dev/null || true

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: '6.x'

      - name: Build WebGL (MainBuildScript.PerformWebGLBuild)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildMethod: MainBuildScript.PerformWebGLBuild
          buildsPath: build

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/385338500348/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ndw-afl3d-ci-deploy@gen-lang-client-0129781718.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to gs://ndw-game-builds/afl3d/
        run: |
          gcloud storage rsync build/WebGL gs://ndw-game-builds/afl3d/ --recursive --delete-unmatched-destination-objects
          echo "Deployed commit ${{ github.sha }} to gs://ndw-game-builds/afl3d/"
