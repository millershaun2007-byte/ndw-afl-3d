name: Build and deploy AFL 3D

# Real CI/deploy pipeline (2026-08-17) — replaces the manual local
# `Unity -batchmode ... && gcloud storage cp` workflow that led to the
# wrong build silently staying live for weeks (see the main app's
# ndw_footy_game_still_broken memory). Every push to main now produces a
# build traceable to a specific commit and deploys it automatically —
# "what's live" is never ambiguous again.

# 2026-08-28: push-to-deploy TURNED OFF. Shaun: "we need to lay of the
# deploys and psuhes a bit i think", after a day where versions appeared to
# change on their own.
#
# They were not changing on their own. Every push built and deployed roughly 8
# minutes later, so you would load the game, see one version, and a few minutes
# later be looking at a different one having done nothing. It also overwrote
# every byte-exact build restored by hand, and the deploy step below does not
# add the ?v= cache-bust stamp - so browsers then cached inconsistently on top.
# Twice today two runs overlapped and landed within seconds of each other.
#
# Deploying is now a deliberate act: Actions > "Build and deploy AFL 3D" > Run
# workflow. Pushing code no longer ships it.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless GCP auth (Workload Identity Federation)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First real run (2026-08-17) failed pulling Unity's WebGL Docker
      # image: "no space left on device" — a known, common issue on
      # GitHub's standard ubuntu-latest runners, which ship ~14GB free but
      # pre-install several multi-GB toolchains (Android SDK, .NET, GHC)
      # this job never uses. Removing them first is the standard fix.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 2026-08-19 — the missing piece this pipeline was blocked on.
      # Unity killed manual .alf/.ulf portal activation for Personal
      # tier (confirmed directly against Unity's own discussion forum
      # and this machine's real license file — no classic serial at
      # all anymore). This is a dedicated third-party action built
      # specifically to activate Personal via direct credential auth
      # against Unity's licensing API (not browser automation) — the
      # sturdier of the two community workarounds found.
      #
      # First real run failed before ever testing the credentials:
      # "Unity Hub is not installed or not accessible" — this action
      # drives licensing through Hub's own CLI, which the runner never
      # had installed. unity-setup (same author) installs Hub.
      #
      # unity-setup@v2 uses apt to install Unity Hub (which the modern
      # Debian package places at /usr/bin/unityhub and /usr/lib/unityhub/),
      # but after installing it looks for the binary at
      # /opt/unityhub/unityhub and fails. The apt install itself
      # succeeds, so continue-on-error lets us capture the installed files
      # and create the expected /opt/unityhub/ layout in the next step —
      # kept as Hub-only (unity-version: None) here specifically so this
      # first call fails fast at the same known point rather than also
      # attempting (and failing) an Editor download before the path fix
      # below has even run.
      - name: Install Unity Hub
        uses: RageAgainstThePixel/unity-setup@v2
        continue-on-error: true
        with:
          unity-version: None

      # The Debian unityhub package installs its whole app tree — the
      # binary, resources/app.asar, AND the separate UnityLicensingClient_V1
      # directory activate-unity-license@v2 needs — under /usr/lib/unityhub/,
      # with /usr/bin/unityhub just a symlink to the binary inside it.
      # unity-setup@v2 and activate-unity-license@v2 both hard-code
      # /opt/unityhub/ and each turned out to need a DIFFERENT file from
      # that real tree (binary, then resources/app.asar, then
      # UnityLicensingClient_V1/Unity.Licensing.Client) — symlinking them
      # in one at a time was chasing the same fact in two places (see this
      # repo's own CLAUDE.md on that recurring bug class). One directory
      # symlink covers the whole tree instead, so nothing else under it
      # can be missing next time a different step needs a different file.
      - name: Fix Unity Hub path layout for unity-setup@v2
        run: |
          sudo rm -rf /opt/unityhub
          sudo ln -sfn /usr/lib/unityhub /opt/unityhub

      # 2026-08-21 — real Editor install, not Hub-only. Previously skipped
      # (the step above's unity-version: None) because game-ci/unity-builder
      # below built via its own separate Docker container. Removed that:
      # its Docker container never saw the license activated on the bare
      # runner below, since they're two different environments — confirmed
      # by a real run reaching "Build WebGL" with a working Hub+license and
      # still failing with "Missing Unity License File and no Serial was
      # found" (unity-builder's own activation script only supports a
      # classic UNITY_SERIAL or a floating UNITY_LICENSING_SERVER, neither
      # of which apply to a Personal-tier credential-only account — see
      # the 2026-08-19 comment above on why the manual .ulf/UNITY_LICENSE
      # route is dead for Personal tier too). Building directly on this
      # runner, in the same place the license activates, is the only path
      # that actually has a working license where the build runs. Now that
      # Hub's own path is fixed (previous step), this second unity-setup
      # call can get all the way through to a real Editor+module install
      # instead of failing at the same early Hub self-check as the first
      # call. cache-installation speeds up subsequent runs — this is a
      # multi-GB download otherwise, on every single push.
      - name: Install Unity Editor + WebGL module
        id: unity
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          build-targets: WebGL
          cache-installation: true

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: '6.x'

      # Direct Editor invocation on this same runner (see the "Install
      # Unity Editor" step's comment for why, replacing game-ci/unity-
      # builder's Docker-based build). Same command/method as the
      # confirmed-working local build (2026-08-21, ~/Projects/ndw-afl-3d,
      # NDW_BUILD_RESULT=Succeeded, 0 errors/warnings, 43s) — MainBuildScript
      # itself reads NDW_BUILD_OUTPUT for where to write the build.
      - name: Build WebGL (MainBuildScript.PerformWebGLBuild)
        env:
          NDW_BUILD_OUTPUT: build/WebGL
        run: |
          "${{ steps.unity.outputs.unity-editor-path }}" \
            -batchmode -quit -nographics \
            -projectPath "$(pwd)" \
            -executeMethod MainBuildScript.PerformWebGLBuild \
            -logFile /dev/stdout

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/385338500348/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ndw-afl3d-ci-deploy@gen-lang-client-0129781718.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to gs://ndw-game-builds/afl3d/
        run: |
          gcloud storage rsync build/WebGL gs://ndw-game-builds/afl3d/ --recursive --delete-unmatched-destination-objects
          # 2026-08-22 — real bug hit live: plain rsync leaves every object
          # with no Cache-Control, so GCS's default (~1hr) caching means a
          # browser that already loaded this game can silently keep serving
          # a stale mix of old+new files after the next deploy (old loader.js
          # against a new WebGL.data, etc.) until its own cache expires.
          # This was fixed once before via a manual setmeta call that didn't
          # survive this pipeline's 2026-08-21 rebuild — setting it here,
          # every deploy, so it can't quietly regress again.
          gcloud storage objects update gs://ndw-game-builds/afl3d/index.html gs://ndw-game-builds/afl3d/Build/WebGL.data gs://ndw-game-builds/afl3d/Build/WebGL.wasm gs://ndw-game-builds/afl3d/Build/WebGL.loader.js gs://ndw-game-builds/afl3d/Build/WebGL.framework.js --cache-control="no-cache, max-age=0"
          # 2026-08-28 — stamp the build URLs. Cache-Control above is not
          # enough: Unity caches .data/.wasm in IndexedDB keyed by URL, and
          # those URLs are identical for every build ever made, so a returning
          # browser replays its cached copy no matter what is in the bucket.
          # HTTP cache headers do not reach IndexedDB. Every rebuild between
          # 17 and 28 Aug was invisible to anyone who had played before.
          STAMP=$(cat build/WebGL/Build/WebGL.wasm build/WebGL/Build/WebGL.data | md5sum | cut -c1-10)
          sed -i \
            -e "s|\"Build/WebGL\.loader\.js[^\"]*\"|\"Build/WebGL.loader.js?v=$STAMP\"|" \
            -e "s|\"Build/WebGL\.data[^\"]*\"|\"Build/WebGL.data?v=$STAMP\"|" \
            -e "s|\"Build/WebGL\.framework\.js[^\"]*\"|\"Build/WebGL.framework.js?v=$STAMP\"|" \
            -e "s|\"Build/WebGL\.wasm[^\"]*\"|\"Build/WebGL.wasm?v=$STAMP\"|" \
            build/WebGL/index.html
          grep -q "?v=$STAMP" build/WebGL/index.html || { echo "cache-bust did not apply"; exit 1; }
          gcloud storage cp build/WebGL/index.html gs://ndw-game-builds/afl3d/index.html \
            --cache-control="no-cache, max-age=0"
          echo "Deployed commit ${{ github.sha }} to gs://ndw-game-builds/afl3d/ (v=$STAMP)"
